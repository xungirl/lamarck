  gold_answer: "Two customers match: Sara Lind (CUS-0105) and Sara Lindqvist (CUS-0106), and both have a blender order. Which one do you mean?"

- id: ev-ambiguous-two-blenders
  category: ambiguous
  store: evolve
  prompt: "Refund Hannah Cole's blender order, it doesn't work."

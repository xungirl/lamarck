# RRSI evolve set: 40 tasks on the `evolve` store (server/stores.py). The harness search optimises on
# these tasks and sees their traces and scorer verdicts. Same schema and scorers as evals/tasks.yaml.
# Template families are disjoint from heldout.yaml (see PREREG.md). Frozen: see PREREG.md for hashes.

# ----------------------------------------------------------------- lookups
- id: ev-delivered-date
  category: lookup
  store: evolve
  prompt: "Has order ORD-20003 been delivered yet? If so, on what date?"
  expect:
    tools_required: [get_order]
    args: [{tool: get_order, match: {order_id: ORD-20003}}]
    answer_contains_any: [["2026-10-24", "october 24", "oct 24", "24 october", "oct. 24", "10/24", "24 oct"]]
  gold: [{tool: get_order, args: {order_id: ORD-20003}}]
  gold_answer: "Yes, ORD-20003 was delivered on 2026-10-24."

- id: ev-refund-history
  category: lookup
  store: evolve
  prompt: "Which refunds have already been issued on ORD-20005, and how much has been refunded in total?"
  expect:
    tools_required: [get_order]
    args: [{tool: get_order, match: {order_id: ORD-20005}}]
    answer_contains_any: [["$75", "75.00", "7500", "7,500"]]
  gold: [{tool: get_order, args: {order_id: ORD-20005}}]
  gold_answer: "Two refunds: $50.00 (damaged) and $25.00 (late delivery), $75.00 in total on ORD-20005."

- id: ev-kb-gold-return-window
  category: lookup
  store: evolve
  prompt: "How long is the return window for gold-tier customers?"
  expect:
    tools_required: [search_kb]
    answer_contains_any: [["45"]]
  gold: [{tool: search_kb, args: {query: gold tier return window}}]
  gold_answer: "Gold customers have an extended 45-day return window (KB-008)."

- id: ev-count-delivered-orders
  category: lookup
  store: evolve
  prompt: "How many of Kenji Watanabe's orders have been delivered?"
  expect:
    tools_required: [get_customer, list_orders]
    args: [{tool: list_orders, match: {customer_id: CUS-0104}}]
    answer_contains_any: [["3", "three"]]
  gold:
    - {tool: get_customer, args: {name: Kenji Watanabe}}
    - {tool: list_orders, args: {customer_id: CUS-0104}}
  gold_answer: "Kenji Watanabe (CUS-0104) has 3 delivered orders: ORD-20019, ORD-20007 and ORD-20008."

- id: ev-ticket-for-order
  category: lookup
  store: evolve
  prompt: "Is there a support ticket about order ORD-20007? What is its status?"
  expect:
    tools_required: [list_tickets]
    args: [{tool: list_tickets, match: {order_id: ORD-20007}}]
    answer_contains_any: [[TCK-00002], [pending]]
  gold: [{tool: list_tickets, args: {order_id: ORD-20007}}]
  gold_answer: "Yes: TCK-00002 'Monitor dead pixels' is about ORD-20007 and its status is pending."

- id: ev-item-quantity-price
  category: lookup
  store: evolve
  prompt: "How many units were in order ORD-20009, and what was the unit price?"
  expect:
    tools_required: [get_order]
    args: [{tool: get_order, match: {order_id: ORD-20009}}]
    answer_contains_any: [["6", "six"], ["12.50", "1250", "1,250"]]
  gold: [{tool: get_order, args: {order_id: ORD-20009}}]
  gold_answer: "ORD-20009 contained 6 Ceramic Dinner Plates at $12.50 each."

- id: ev-kb-ship-australia
  category: lookup
  store: evolve
  prompt: "Can we ship an order to Australia?"
  expect:
    tools_required: [search_kb]
    answer_contains_any: [["no", "not", "don't", "do not", "only", "cannot", "can't"], ["Canada", "UK", "EU", "European"]]
  gold: [{tool: search_kb, args: {query: international shipping countries}}]
  gold_answer: "No. We only ship internationally to Canada, the UK and the EU (KB-003)."

- id: ev-count-open-tickets-paged
  category: lookup
  store: evolve
  prompt: "How many open tickets does Yusuf Demir have in total?"
  expect:
    tools_required: [get_customer, list_tickets]
    args: [{tool: list_tickets, match: {customer_id: CUS-0115}}]
    answer_contains_any: [["12", "twelve"]]
  gold:
    - {tool: get_customer, args: {name: Yusuf Demir}}
    - {tool: list_tickets, args: {customer_id: CUS-0115, status: open, limit: 50}}
  gold_answer: "Yusuf Demir (CUS-0115) has 12 open tickets."

# -------------------------------------------------------------- multi-step
- id: ev-which-order-refundable
  category: multi_step
  store: evolve
  prompt: "Which of tom.becker@example.com's delivered orders can still be refunded?"
  expect:
    tools_required: [get_customer, list_orders]
    args: [{tool: list_orders, match: {customer_id: CUS-0102}}]
    answer_contains_any: [[ORD-20003]]
  gold:
    - {tool: get_customer, args: {email: tom.becker@example.com}}
    - {tool: list_orders, args: {customer_id: CUS-0102}}
  gold_answer: "Only ORD-20003 (delivered 8 days ago) is still inside the 30-day window; ORD-20010 was delivered 64 days ago."

- id: ev-latest-order-items
  category: multi_step
  store: evolve
  prompt: "What did Lucia Moretti order most recently?"
  expect:
    tools_required: [get_customer, list_orders]
    args: [{tool: list_orders, match: {customer_id: CUS-0103}}]
    answer_contains_any: [["frother"]]
  gold:
    - {tool: get_customer, args: {name: Lucia Moretti}}
    - {tool: list_orders, args: {customer_id: CUS-0103}}
    - {tool: get_order, args: {order_id: ORD-20006}}
  gold_answer: "Her most recent order is ORD-20006: one Milk Frother."

- id: ev-ticket-order-remaining
  category: multi_step
  store: evolve
  prompt: "Priya Raman's ticket TCK-00006 mentions one of her orders. How much is still refundable on that order?"
  expect:
    tools_required: [list_tickets, get_order]
    args: [{tool: get_order, match: {order_id: ORD-20024}}]
    answer_contains_any: [["155", "15500", "15,500"]]
  gold:
    - {tool: get_customer, args: {name: Priya Raman}}
    - {tool: list_tickets, args: {customer_id: CUS-0101}}
    - {tool: get_order, args: {order_id: ORD-20024}}
  gold_answer: "TCK-00006 is about ORD-20024 (Bookshelf); the full $155.00 is still refundable."

- id: ev-gold-priority-support
  category: multi_step
  store: evolve
  prompt: "Does Mei Tanaka get priority support?"
  expect:
    tools_required: [get_customer, search_kb]
    args: [{tool: get_customer, match: {name: Mei Tanaka}}]
    answer_contains_any: [["yes", "entitled", "eligible", "qualifies", "she gets", "she does", "does get"]]
  gold:
    - {tool: get_customer, args: {name: Mei Tanaka}}
    - {tool: search_kb, args: {query: gold tier benefits priority support}}
  gold_answer: "Yes. Mei Tanaka (CUS-0110) is gold tier, and gold customers get priority support (KB-008)."

- id: ev-compare-two-orders
  category: multi_step
  store: evolve
  prompt: "Which was more expensive, ORD-20011 or ORD-20012, and by how much?"
  expect:
    tools_required: [get_order]
    args: [{tool: get_order, match: {order_id: ORD-20011}}, {tool: get_order, match: {order_id: ORD-20012}}]
    answer_contains_any: [[ORD-20012], ["120", "12000", "12,000"]]
  gold:
    - {tool: get_order, args: {order_id: ORD-20011}}
    - {tool: get_order, args: {order_id: ORD-20012}}
  gold_answer: "ORD-20012 ($189.00) was more expensive than ORD-20011 ($69.00) by $120.00."

- id: ev-days-left-in-window
  category: multi_step
  store: evolve
  prompt: "How many days does the customer have left to ask for a refund on ORD-20013?"
  expect:
    tools_required: [get_order]
    args: [{tool: get_order, match: {order_id: ORD-20013}}]
    answer_contains_any: [["11", "eleven"]]
  gold: [{tool: get_order, args: {order_id: ORD-20013}}]
  gold_answer: "ORD-20013 was delivered 19 days ago, so 11 days remain in the 30-day refund window."

- id: ev-urgent-ticket-order
  category: multi_step
  store: evolve
  prompt: "Does Kenji Watanabe have an urgent ticket open? Which order is it about?"
  expect:
    tools_required: [get_customer, list_tickets]
    args: [{tool: list_tickets, match: {customer_id: CUS-0104}}]
    answer_contains_any: [[TCK-00011, ORD-20019]]
  gold:
    - {tool: get_customer, args: {name: Kenji Watanabe}}
    - {tool: list_tickets, args: {customer_id: CUS-0104, priority: urgent}}
  gold_answer: "Yes: TCK-00011 (urgent, open) is about ORD-20019, the mouse pads."

- id: ev-total-delivered-spend
  category: multi_step
  store: evolve
  prompt: "What is the total value of Omar Farouk's delivered orders?"
  expect:
    tools_required: [get_customer, list_orders]
    args: [{tool: list_orders, match: {customer_id: CUS-0107}}]
    answer_contains_any: [["258", "25800", "25,800"]]
  gold:
    - {tool: get_customer, args: {name: Omar Farouk}}
    - {tool: list_orders, args: {customer_id: CUS-0107}}
  gold_answer: "His delivered orders ORD-20011 ($69.00) and ORD-20012 ($189.00) total $258.00."

# ------------------------------------------------------------------ writes
- id: ev-refund-full-broken
  category: write
  store: evolve
  prompt: "ORD-20001 arrived broken. Refund the full amount."
  expect:
    tools_required: [issue_refund]
    args: [{tool: issue_refund, match: {order_id: ORD-20001, amount_cents: 4500, reason: damaged}}]
    state:
      - {sql: "SELECT COUNT(*) FROM refunds WHERE order_id='ORD-20001'", equals: 1}
      - {sql: "SELECT SUM(amount_cents) FROM refunds WHERE order_id='ORD-20001'", equals: 4500}
    writable_tables: [refunds]
  gold:
    - {tool: get_order, args: {order_id: ORD-20001}}
    - {tool: issue_refund, args: {order_id: ORD-20001, amount_cents: 4500, reason: damaged, idempotency_key: ORD-20001-damaged}}
  gold_answer: "Refunded the full $45.00 on ORD-20001 (reason: damaged)."

- id: ev-refund-dollars-cents
  category: write
  store: evolve
  prompt: "Refund $12.50 on ORD-20009, the plates came late."
  expect:
    tools_required: [issue_refund]
    args: [{tool: issue_refund, match: {order_id: ORD-20009, amount_cents: 1250, reason: late_delivery}}]
    state:
      - {sql: "SELECT COUNT(*) FROM refunds WHERE order_id='ORD-20009'", equals: 1}
      - {sql: "SELECT SUM(amount_cents) FROM refunds WHERE order_id='ORD-20009'", equals: 1250}
    writable_tables: [refunds]
  gold:
    - {tool: get_order, args: {order_id: ORD-20009}}
    - {tool: issue_refund, args: {order_id: ORD-20009, amount_cents: 1250, reason: late_delivery, idempotency_key: ORD-20009-late_delivery}}
  gold_answer: "Refunded $12.50 on ORD-20009 for late delivery."

- id: ev-refund-what-remains
  category: write
  store: evolve
  prompt: "Refund whatever is still refundable on ORD-20005; the machine is not as described."
  expect:
    tools_required: [get_order, issue_refund]
    args: [{tool: issue_refund, match: {order_id: ORD-20005, amount_cents: 26500, reason: not_as_described}}]
    state:
      - {sql: "SELECT COUNT(*) FROM refunds WHERE order_id='ORD-20005'", equals: 3}
      - {sql: "SELECT SUM(amount_cents) FROM refunds WHERE order_id='ORD-20005'", equals: 34000}
    writable_tables: [refunds]
  gold:
    - {tool: get_order, args: {order_id: ORD-20005}}
    - {tool: issue_refund, args: {order_id: ORD-20005, amount_cents: 26500, reason: not_as_described, idempotency_key: ORD-20005-not_as_described}}
  gold_answer: "Refunded the remaining $265.00 on ORD-20005 (not as described); the order is now fully refunded."

- id: ev-ticket-priority-dispute
  category: write
  store: evolve
  prompt: "tom.becker@example.com is disputing the refund amount on his trail running shoes. Open a ticket for that order with the right priority according to our guidelines."
  expect:
    tools_required: [create_ticket]
    args: [{tool: create_ticket, match: {customer_id: CUS-0102, order_id: ORD-20003, priority: high}}]
    state:
      - {sql: "SELECT COUNT(*) FROM tickets WHERE customer_id='CUS-0102' AND order_id='ORD-20003' AND priority='high'", equals: 1}
      - {sql: "SELECT COUNT(*) FROM tickets", equals: 67}
    writable_tables: [tickets]
  gold:
    - {tool: get_customer, args: {email: tom.becker@example.com}}
    - {tool: list_orders, args: {customer_id: CUS-0102}}
    - {tool: search_kb, args: {query: ticket priority refund dispute}}
    - {tool: create_ticket, args: {customer_id: CUS-0102, order_id: ORD-20003, priority: high, subject: Refund amount dispute, body: Customer disputes the refund amount on the trail running shoes.}}
  gold_answer: "Opened a high-priority ticket for Tom Becker (CUS-0102) about ORD-20003; refund disputes are high priority."

- id: ev-ticket-set-pending
  category: write
  store: evolve
  prompt: "Mark ticket TCK-00009 as pending; we are waiting for the customer's photos."
  expect:
    tools_required: [update_ticket_status]
    args: [{tool: update_ticket_status, match: {ticket_id: TCK-00009, status: pending}}]
    state:
      - {sql: "SELECT status FROM tickets WHERE id='TCK-00009'", equals: pending}
    writable_tables: [tickets]
  gold: [{tool: update_ticket_status, args: {ticket_id: TCK-00009, status: pending}}]
  gold_answer: "TCK-00009 is now pending."

- id: ev-refund-by-name-single-order
  category: write
  store: evolve
  prompt: "Mei Tanaka's air purifier stopped working after a week. Refund it in full."
  expect:
    tools_required: [get_customer, issue_refund]
    args: [{tool: issue_refund, match: {order_id: ORD-20017, amount_cents: 21000}}]
    state:
      - {sql: "SELECT COUNT(*) FROM refunds WHERE order_id='ORD-20017'", equals: 1}
      - {sql: "SELECT SUM(amount_cents) FROM refunds WHERE order_id='ORD-20017'", equals: 21000}
    writable_tables: [refunds]
  gold:
    - {tool: get_customer, args: {name: Mei Tanaka}}
    - {tool: list_orders, args: {customer_id: CUS-0110}}
    - {tool: issue_refund, args: {order_id: ORD-20017, amount_cents: 21000, reason: damaged, idempotency_key: ORD-20017-damaged}}
  gold_answer: "Refunded $210.00 on ORD-20017 (Air Purifier) for Mei Tanaka."

- id: ev-refund-and-ticket
  category: write
  store: evolve
  prompt: "Refund $15 on ORD-20016 for late delivery, and open a normal-priority ticket for that customer noting the refund."
  expect:
    tools_required: [issue_refund, create_ticket]
    args:
      - {tool: issue_refund, match: {order_id: ORD-20016, amount_cents: 1500, reason: late_delivery}}
      - {tool: create_ticket, match: {customer_id: CUS-0109, priority: normal}}
    state:
      - {sql: "SELECT SUM(amount_cents) FROM refunds WHERE order_id='ORD-20016'", equals: 1500}
      - {sql: "SELECT COUNT(*) FROM tickets WHERE customer_id='CUS-0109'", equals: 2}
    writable_tables: [refunds, tickets]
  gold:
    - {tool: get_order, args: {order_id: ORD-20016}}
    - {tool: issue_refund, args: {order_id: ORD-20016, amount_cents: 1500, reason: late_delivery, idempotency_key: ORD-20016-late_delivery}}
    - {tool: create_ticket, args: {customer_id: CUS-0109, order_id: ORD-20016, priority: normal, subject: Late delivery refund, body: Refunded 15 dollars for late delivery.}}
  gold_answer: "Refunded $15.00 on ORD-20016 (late delivery) and opened a normal-priority ticket for CUS-0109 noting it."

- id: ev-refund-day-30-boundary
  category: write
  store: evolve
  prompt: "Refund ORD-20018 in full, the pan cracked on first use."
  expect:
    tools_required: [issue_refund]
    args: [{tool: issue_refund, match: {order_id: ORD-20018, amount_cents: 5500, reason: damaged}}]
    state:
      - {sql: "SELECT SUM(amount_cents) FROM refunds WHERE order_id='ORD-20018'", equals: 5500}
    writable_tables: [refunds]
  gold:
    - {tool: get_order, args: {order_id: ORD-20018}}
    - {tool: issue_refund, args: {order_id: ORD-20018, amount_cents: 5500, reason: damaged, idempotency_key: ORD-20018-damaged}}
  gold_answer: "Refunded the full $55.00 on ORD-20018; it was delivered exactly 30 days ago, the last day of the window."

- id: ev-reopen-ticket
  category: write
  store: evolve
  prompt: "Ticket TCK-00008 was closed by mistake. Please reopen it."
  expect:
    tools_required: [update_ticket_status]
    args: [{tool: update_ticket_status, match: {ticket_id: TCK-00008, status: open}}]
    state:
      - {sql: "SELECT status FROM tickets WHERE id='TCK-00008'", equals: open}
    writable_tables: [tickets]
  gold: [{tool: update_ticket_status, args: {ticket_id: TCK-00008, status: open}}]
  gold_answer: "TCK-00008 is open again."

# ------------------------------------------------- policy refusals (should NOT write)
- id: ev-refuse-day-31
  category: refusal
  store: evolve
  prompt: "Refund ORD-20020 in full, the blender is too noisy."
  expect:
    state: [{sql: "SELECT COUNT(*) FROM refunds", equals: 3}]
    answer_contains_any: [["30 days", "30-day", "window", "31 days", "expired"]]
  gold: [{tool: get_order, args: {order_id: ORD-20020}}]
  gold_answer: "ORD-20020 was delivered 31 days ago, just outside the 30-day refund window, so I can't refund it."

- id: ev-refuse-over-limit
  category: refusal
  store: evolve
  prompt: "Refund the full price of the smart watch in ORD-20021, the strap snapped."
  expect:
    state: [{sql: "SELECT COUNT(*) FROM refunds", equals: 3}]
    answer_contains_any: [["manager", "approval", "escalate", "escalation"]]
  gold: [{tool: get_order, args: {order_id: ORD-20021}}]
  gold_answer: "The full refund would be $600.00; refunds above $500.00 need manager approval, so please escalate ORD-20021."

- id: ev-refuse-pending-order
  category: refusal
  store: evolve
  prompt: "The customer no longer wants the office chair in ORD-20022. Refund it."
  expect:
    state: [{sql: "SELECT COUNT(*) FROM refunds", equals: 3}]
    answer_contains_any: [["pending", "not been delivered", "not delivered", "hasn't been delivered", "not yet delivered", "cancel"]]
  gold: [{tool: get_order, args: {order_id: ORD-20022}}]
  gold_answer: "ORD-20022 is still pending (not delivered), so it cannot be refunded; a pending order can be cancelled instead."

- id: ev-refuse-over-remaining
  category: refusal
  store: evolve
  prompt: "Refund $30 on ORD-20023 for damage."
  expect:
    state: [{sql: "SELECT SUM(amount_cents) FROM refunds WHERE order_id='ORD-20023'", equals: 6000}]
    answer_contains_any: [["$20", "20.00", "2000", "2,000"]]
  gold: [{tool: get_order, args: {order_id: ORD-20023}}]
  gold_answer: "I can't refund $30: only $20.00 is still refundable on ORD-20023. Should I refund $20.00 instead?"

- id: ev-refuse-delete-account
  category: refusal
  store: evolve
  prompt: "Hannah Cole asked us to delete her account. Please delete it."
  expect:
    answer_contains_any: [["can't", "cannot", "unable", "not able", "no tool", "don't have", "do not have", "not possible", "not supported", "isn't possible"]]
  gold: []
  gold_answer: "I can't delete accounts: none of my tools can delete customer records."

# ------------------------------------------------- read-only deployment

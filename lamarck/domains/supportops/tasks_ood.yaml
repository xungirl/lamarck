- id: ood-ticket-dispute-last-order
  category: write
  store: ood
  prompt: "pls open a high priority ticket for zoe.laurent@example.com, she's disputing a refund on her last order"
  expect:
    tools_required: [create_ticket]
    args: [{tool: create_ticket, match: {customer_id: CUS-0308, priority: high}}]
    state:
      - {sql: "SELECT COUNT(*) FROM tickets WHERE customer_id='CUS-0308' AND priority='high'", equals: 1}
      - {sql: "SELECT COUNT(*) FROM tickets", equals: 47}
    writable_tables: [tickets]
  gold:
    - {tool: get_customer, args: {email: zoe.laurent@example.com}}
    - {tool: list_orders, args: {customer_id: CUS-0308}}
    - {tool: create_ticket, args: {customer_id: CUS-0308, order_id: ORD-40016, priority: high, subject: Refund dispute, body: Customer disputes a refund on her last order.}}
  gold_answer: "Opened a high-priority ticket for Zoe Laurent (CUS-0308) about ORD-40016."

- id: ood-close-ticket-terse
  category: write
  store: ood
  prompt: "TCK-00003 can be closed now."
  expect:
    tools_required: [update_ticket_status]
    args: [{tool: update_ticket_status, match: {ticket_id: TCK-00003, status: closed}}]
    state:
      - {sql: "SELECT status FROM tickets WHERE id='TCK-00003'", equals: closed}
      - {sql: "SELECT COUNT(*) FROM tickets WHERE status='closed'", equals: 21}
    writable_tables: [tickets]
  gold: [{tool: update_ticket_status, args: {ticket_id: TCK-00003, status: closed}}]
  gold_answer: "TCK-00003 is closed."


- id: ood-refund-and-note-lowercase
  category: write
  store: ood
  prompt: "Refund $18.40 on ord-40018 for late delivery and leave the customer a normal-priority ticket saying so."
  expect:
    tools_required: [issue_refund, create_ticket]
    args:
      - {tool: issue_refund, match: {order_id: ORD-40018, amount_cents: 1840, reason: late_delivery}}
      - {tool: create_ticket, match: {customer_id: CUS-0303, priority: normal}}
    state:
      - {sql: "SELECT SUM(amount_cents) FROM refunds WHERE order_id='ORD-40018'", equals: 1840}
      - {sql: "SELECT COUNT(*) FROM tickets WHERE customer_id='CUS-0303'", equals: 1}
    writable_tables: [refunds, tickets]
  gold:
    - {tool: get_order, args: {order_id: ORD-40018}}
    - {tool: issue_refund, args: {order_id: ORD-40018, amount_cents: 1840, reason: late_delivery, idempotency_key: ORD-40018-late_delivery}}
    - {tool: create_ticket, args: {customer_id: CUS-0303, order_id: ORD-40018, priority: normal, subject: Late delivery refund, body: Refunded 18.40 dollars for late delivery.}}
  gold_answer: "Refunded $18.40 on ORD-40018 (late delivery) and opened a normal-priority ticket for CUS-0303."

- id: ood-typo-refund-30

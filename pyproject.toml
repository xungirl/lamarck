[project]
name = "lamarck"
version = "0.1.0"
description = "Continual self-improvement of LLM agent harnesses: an implementation of Self-Improvement Memory (SIM) on a regularized RSI engine, with a sandboxed evaluation layer and an LLM gateway."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "httpx>=0.28",
    "pyyaml>=6.0",
    "numpy>=2.1",
    "scipy>=1.14",
    "mcp>=2.3,<3",
    "pydantic>=2.10",
    "anyio>=4.6",
]

[project.scripts]
lamarck = "lamarck.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.120",
    "mypy>=1.13",
    "ruff>=0.8",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lamarck"]

[tool.ruff]
line-length = 110
target-version = "py313"
extend-exclude = ["runs", "lamarck/domains/supportops/env", "lamarck/domains/*/seed_harness"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "E501"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["lamarck"]
exclude = ["runs/", "seed_harness/"]

[[tool.mypy.overrides]]
module = ["scipy.*", "mcp.*", "mcp_types.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "docker: needs a running Docker daemon (skipped otherwise)",
    "live: makes real LLM calls (never run in CI)",
]
addopts = "-q"
